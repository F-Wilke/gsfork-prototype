name: REP MOVSB microbenchmark
on:
  push:
    branches: [bench/rep-movsb-fs-wrapper]
  pull_request:
    paths:
      - 'src/**'
      - 'benchmark.py'
      - 'validate.py'
      - 'rewrite.py'
      - 'Makefile'
      - '.github/workflows/rep-movsb-bench.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: make test
      - name: Run all five microbenchmarks with paired variants
        run: |
          python benchmark.py --samples 7 --target-ms 30 --output results/ci-rep-movsb
          cat results/ci-rep-movsb/table.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep-movsb-microbenchmark
          path: |
            results/ci-rep-movsb/
            results/validation.json
